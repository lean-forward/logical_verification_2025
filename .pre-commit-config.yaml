# ai-generated: pre-commit rejects unknown top-level keys in this file, so the
# usual YAML front matter `tags:` list cannot be used here. The `ai-generated`
# tag is recorded in this comment instead.
#
# Install once per clone:  pre-commit install
# Run on everything:       pre-commit run --all-files
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-yaml
      # The PDFs are large by design and are already tracked.
      - id: check-added-large-files
        exclude: \.pdf$
      - id: check-json
        files: ^lean/lake-manifest\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=no]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # The upstream hook runs `gitleaks git --staged`, which scans the index.
      # In CI nothing is staged, so it scans 0 bytes and always passes. `dir`
      # mode scans the working tree instead, which works in both places.
      - id: gitleaks
        entry: gitleaks dir . --no-banner --redact
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
